name: Publish Container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to publish
        required: true
        default: v0.1.0
      publish_latest:
        description: Also publish the latest tag
        required: true
        default: "true"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/quantyra/kuzuryu-board-meetings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.release.tag_name }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.publish_latest == 'true' || github.event_name == 'release' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
