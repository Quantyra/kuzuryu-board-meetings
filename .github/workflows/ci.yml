name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Radon cyclomatic complexity
        run: radon cc src tests -s -a
      - name: Radon maintainability index
        run: radon mi src tests -s
      - name: Security sweep
        run: python scripts/security_sweep.py

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t kuzuryu-board-meetings:ci .
      - name: Run container
        run: |
          docker run -d --rm \
            --name kuzuryu-board-meetings-smoke \
            -e BOARD_AUTH_TOKEN=ci-smoke-token \
            -p 8000:8000 \
            kuzuryu-board-meetings:ci
      - name: Check health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs kuzuryu-board-meetings-smoke
          exit 1
