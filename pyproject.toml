[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kuzuryu-board-meetings"
version = "0.1.0"
description = "Slack board meeting minutes, quorum, and voting service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Quantyra" }]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "radon>=6.0",
  "ruff>=0.6",
]

[project.scripts]
kuzuryu-board-meetings = "kuzuryu_board_meetings.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kuzuryu_board_meetings"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=kuzuryu_board_meetings --cov-report=term-missing"

