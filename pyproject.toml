[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kuzuryu-board-meetings"
version = "0.1.1"
description = "Slack board meeting minutes, quorum, and voting service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Quantyra" }]
keywords = ["slack", "board", "minutes", "voting", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business",
]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "uvicorn[standard]>=0.30",
]

[project.urls]
Homepage = "https://github.com/Quantyra/kuzuryu-board-meetings"
Repository = "https://github.com/Quantyra/kuzuryu-board-meetings"
Issues = "https://github.com/Quantyra/kuzuryu-board-meetings/issues"
Changelog = "https://github.com/Quantyra/kuzuryu-board-meetings/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "radon>=6.0",
  "ruff>=0.6",
]

[project.scripts]
kuzuryu-board-meetings = "kuzuryu_board_meetings.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kuzuryu_board_meetings"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp --cov=kuzuryu_board_meetings --cov-report=term-missing --cov-fail-under=80"
